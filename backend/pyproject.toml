[project]
name = "flow-backend"
version = "0.1.0"
description = "Cathay Flow backend: FastAPI, replay clock, policy"
requires-python = ">=3.12"
dependencies = [
    "flowcore",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
flowcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
