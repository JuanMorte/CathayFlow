# Time-to-gate engine parameters (AGENTS.md §11.1). Every value says where it comes from.
# All times are minutes unless the name says otherwise.

# Monte Carlo samples per connection.
samples: 2000
# Default seed; every stochastic function also takes one explicitly.
seed: 20261114

# REAL: Cathay closes the gate 15 minutes before departure (since 1 Jun 2026, AGENTS.md §11.1).
gate_close_minutes: 15

# ASSUMED: time from touchdown to the gate. Only used when we know a landing time but not a
# gate time (OAG on-ground estimates). HKIA past data has gate times, not landing times, so this
# could not be fitted from it (docs/build_log.md, M1).
taxi_in: {mean: 8, sd: 3, floor: 3}

# ASSUMED: uncertainty of an inbound gate-time estimate, by what is known.
# - airborne: a published in-flight estimate still moves a little.
# - landed: only taxi-in remains (see taxi_in).
inbound_estimate_sd:
  airborne: 6
  at_gate: 0

# ASSUMED: time from door open until this passenger is off the aircraft.
# First and Business leave first; Economy depends on the row (front 8 min, back 18 min).
deplane:
  F: {mean: 5, sd: 2, floor: 1}
  J: {mean: 5, sd: 2, floor: 1}
  W: {mean: 9, sd: 3, floor: 2}
  Y: {front: 8, back: 18, sd: 2, floor: 3}

# ASSUMED: bus from a remote stand to the terminal.
bus: {mean: 10, sd: 3, floor: 4}

# ASSUMED: transfer security, 5 to 20 minutes, rising with how busy the arrival wave is.
# wave_load is 0 (empty) to 1 (the busiest half-hour in the history window).
security: {base: 7, per_load: 9, sd: 3, floor: 3}

# ASSUMED: walking speed in metres per second (typical adult walking pace).
walk_speed: {mean: 1.2, sd: 0.2, floor: 0.7}
# ASSUMED: spread of the Midfield train time around hkg_zones.yaml's train_minutes.
train_sd: 1.5

# ASSUMED: fast-track or escort shortens the transfer by about 6 minutes. Not proven to save
# connections; always shown as ASSUMED.
expedite: {mean: 6, sd: 2}

# ASSUMED: what "typical" means when naming the drivers of a tight connection.
typical:
  wave_load: 0.4
  walk_m: 500
  row_frac: 0.5

# Baselines kept for comparison (AGENTS.md §11.1).
# R0: fixed rule, deplane 8 + transfer 15 + gate close 15.
baseline_r0_minutes: 38
