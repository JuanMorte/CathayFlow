# Policy parameters (AGENTS.md §11.1 to §11.4). Every value says where it comes from.
# Thresholds are never shown in the UI.

# ASSUMED: zone thresholds on the chance of missing, with a band so the status does not flicker.
tau_watch: 0.20     # below: SAFE
tau_act: 0.70       # above: WONT_MAKE; between: AT_RISK
hysteresis: 0.05
# ASSUMED: from this chance of missing, a held backup is put to staff for approval, so an
# at-risk passenger may switch before landing. Won't-make passengers are always drafted.
tau_offer: 0.40
# ASSUMED: a hold is released after this many consecutive SAFE ticks.
safe_ticks_to_release: 2

# ASSUMED: a backup hold expires this long after the original gate close.
hold_expiry_after_gate_close_minutes: 30

# ASSUMED: free seats per later flight and cabin ("medium" day). OAG gives aircraft capacity,
# not availability, so this stays an assumption until an airline inventory is connected.
free_seats: {F: 1, J: 3, W: 2, Y: 6}
# ASSUMED: how many of those seats other passengers take per hour of replay time.
seat_depletion_per_hour: 0.5

# ASSUMED: escorts available per 30 minutes.
expedite_capacity_per_30min: 4

# ASSUMED: weights for choosing who gets a scarce seat. Tier is a weight, never an override;
# families move together and assistance passengers go first as hard rules, not weights.
tier_weight: {Diamond: 1.3, Gold: 1.2, Silver: 1.1, Green: 1.0, None: 1.0}
cabin_weight: {F: 1.3, J: 1.2, W: 1.1, Y: 1.0}

# ASSUMED: a later flight counts as an alternative if it leaves within this many hours of the
# original departure (same day or next morning).
alternative_window_hours: 20
