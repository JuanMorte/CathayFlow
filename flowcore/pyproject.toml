[project]
name = "flowcore"
version = "0.1.0"
description = "Cathay Flow shared core: config, AWS helpers, cached API clients, model registry, engine"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowcore"]
