[project]
name = "flowresearch"
version = "0.1.0"
description = "Cathay Flow research: dataset, backtests, policy simulation, evidence"
requires-python = ">=3.12"
# Heavy libraries (pandas, DuckDB, LightGBM, scikit-learn, matplotlib) are added in M4.
dependencies = [
    "flowcore",
]

[tool.uv.sources]
flowcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowresearch"]
