# HKG Terminal 1 zones and walking distances. Label: ASSUMED.
#
# What is REAL here: the stand and gate identifiers, taken from the HKIA past-flights data
# (2026-08-15 to 2026-11-13, Cathay-operated flights). A contact stand carries its gate number
# (stand N64 = gate 64, S23 = gate 23, R17 = gate 17), so one table serves both.
# What is ASSUMED: the grouping into zones and every distance below. They are our reading of the
# public terminal map (a long spine from the East Hall to the West Hall, with branches), not a
# survey. Change them here; nothing in the code hard-codes a distance.

# x: metres along the spine from the East Hall. branch: extra metres off the spine.
zones:
  east:       {x: 100, branch: 0,   name: "East Hall gates"}
  central:    {x: 350, branch: 0,   name: "Central Concourse"}
  satellite:  {x: 350, branch: 500, name: "T1 Satellite Concourse (Sky Bridge)"}
  mid:        {x: 600, branch: 0,   name: "Central Concourse, west end"}
  west:       {x: 850, branch: 0,   name: "West Hall"}
  northwest:  {x: 850, branch: 300, name: "North-west Concourse"}
  bus_gates:  {x: 200, branch: 100, name: "Bus gates"}
  midfield:   {x: 850, branch: 0,   name: "Midfield Concourse", train_minutes: 6}

# Gate or contact-stand number → zone (inclusive ranges).
number_ranges:
  - {from: 1,   to: 4,   zone: east}
  - {from: 5,   to: 12,  zone: central}
  - {from: 13,  to: 21,  zone: satellite}
  - {from: 22,  to: 36,  zone: mid}
  - {from: 40,  to: 50,  zone: west}
  - {from: 60,  to: 80,  zone: northwest}
  - {from: 201, to: 230, zone: midfield}
  - {from: 501, to: 530, zone: bus_gates}

# Stands with a three-digit number outside the Midfield range are remote: passengers are bussed
# to the terminal and start walking from `remote_arrival_zone`.
remote_arrival_zone: east

# Walking between two zones = |x1 - x2| + branch1 + branch2 + transfer_detour_m.
# Inside one zone the walk is `same_zone_m`.
same_zone_m: 120
# Extra metres to pass through a transfer security point on the way.
transfer_detour_m: 150
# Used when a stand or gate is missing or unknown.
default_zone: central
